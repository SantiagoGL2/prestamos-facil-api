spring:
  application:
    name: prestamos-facil-api

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/freepdb1
    username: prestamos_user
    password: prestamos_pass
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672

  mail:
    host: localhost
    port: 1025

server:
  port: 8080